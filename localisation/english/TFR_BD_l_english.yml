PRC_BD_faction_system: "From Decay, Emerges Rebirth"
PRC_BD_faction_system_desc: "\n\n\n\n\n\n\n\n\n\n\n\n\nHuixia is in §Rdecay§!, its leaves and branches falling off like §Ocinder from a dying fire§!. If nothing is done, the Manchu Global Elite will soon §Rdestroy§! the very essence of what it means to be §8Han§!, replaced with a Multicultural, Globalist, and Degenerate §Lshell§! of a nation, 3 thousand years of culture §Rextinguished.§!\n\n§tThis cannot happen.§!\n\nAs more people realise the truth, and shield their eyes from the Manchu lies, the state begins to falter, allowing in those moments for us to §9strike§!, and hopefully, once our numbers could blot out the §8tallest Huixian mountain§!, we shall §9reclaim our nation§!, and begin the great effort to prevent it from falling into ruin, §tever again.§t\n\n§YGather Lotus Blooms to increase the strength of our Movement, until we have the power to strike.§!\n§YHowever, Manchu Awareness will always be increasing, spelling §!§Rruin§! §Yfor our struggle if not contained.§!\n\nGathering our forces while avoiding their detection will be a tricky game to balance,\n§5So Choose your Actions Wisely.§!\n\n§GReach 10 Lotus Blooms to succeed!§!\n\n§RAvoid Awareness reaching 10, at all costs.§!\n\n\nLOTUS BLOOMS HAVE MADE OUR POWER:       §W[BD_Lotus_Bloom_lvl]§!\n\n\nMANCHU FIGURES ARE CURRENTLY:              §W[BD_Gov_Awareness_lvl]§!"
PRC_growing_gov_sus_mission: "Growing Manchu Suspicion"
PRC_growing_gov_sus_mission_desc: "As the Manchu's favourite play-thing, The PLA, while masquerading as a "temporary stabilization government, still holds complete power over the Government, including the MSS.\nAs our roots stretch deeper into the decaying bark of the State, the beady eyes of the Manchu caucus become increasingly more irritated by our actions.\nEither we cut off the head of the snake first, or we shall sucumb to its poison."
PRC_use_the_internet:0 "Reach Through Their Screens"
PRC_use_the_internet_desc: "Were it not for the internet, Zhou would never have the chance he now holds. The internet is a breeding ground for the radicals of society, those who wish for change, and those who are willing to kill for it."
PRC_protect_civilian_han:0 "Ensure the safety of Han Neighborhoods"
PRC_protect_civilian_han_desc: "As our numbers group, it has become increasingly clear that we have a moral duty to protect our own people from the vicious and bloodthirsty manchu threat, which is beset on destroying our peaceful neighborhoods.\nWith a few "friendly" faces around our streets, the Manchurians will no longer dare try to enter."
PRC_entice_the_broken:0 "Entice the Broken"
PRC_entice_the_broken_desc: "White Lotus Societies have always been known to house the more... outcasted members of society, be it for their beliefs or their unwillingness to conform to the Manchu tyranny.\nOur group shall become a safe-haven for the downtrodden, a new beacon of hope in endless darkness which now envelops our homeland."
PRC_afraid_eyes_but_hands:0 "Eye's fear... §0but hands do§!"
PRC_afraid_eyes_but_hands_desc: "No matter how secretive we are, the Manchurian bureaucracy and secret police are always just 1 step behind us, constantly just inches away from grabbing our tail, and dragging us back into irrelevance.\nYet no longer will this be tolerated, for we shall lay down the plogue in these times of struggle, and pick up a knife instead."
