l_english:
PRC_AFG_exploit_dem_gans:0 "From the Mines, to the Grave"
PRC_AFG_exploit_dem_gans_desc:0 "§RDesolation§!\n\nTo look upon the lands of the Afghan people now is to look into the eyes of a dying animal; hope, whatever was left of it, is utterly vanquished in its teary eyes, despair taking all that is left.\n\nAfganistan, once considered the Graveyard of Empires, with its rich history and even richer tales of resistance, lies in complete ruin, as their new Chinese occupiers step through the rubble, saving only what they consider 'valuable' for their future schemes. The lightning-quick strike by the Chinese military has left the Afghan cities in varying states of ruin, their corpses acting as living mausoleums for the survivors.\nWhile the Chinese government had proclaimed that their new regime was there to 'liberate' the Afghan people from decades of 'radical Islamic terror', its facade crumbled once the flood of Chinese mining companies entered the lands en masse, giving secret permission to ignore labour laws, seeing these newly conquered regions as their new goldmine, even if the minerals have to be pruned from bloodied hands.\n\nAs the only real governing body left in the entire country, the Afgan people are forced to work in the new 'Mining towns' set up across the acrid landscape, their new lives one of never-ending labor, exhaustion, and pure misery. Any ideas of rebellion, or even passive protest, are destroyed while still just thoughts, as every worker is just 1 meal away from near certain death, and a single missing pay cheque is enough to doom their entire family. The risk of death was already terrifyingly high even when staying strictly in-line.\nThe streets now stay quiet, devoid of any laughter, parks empty of people's glee, and even the cries of children have become deafeningly silent. A fog of defeat lingers in every corner of this new Afghanistan, its people shambling onwards, living just to approach death sooner, the Graveyard of Empires now the graveyard for its own people."
TAL_to_the_last:0 "To the Last Man..."
TAL_to_the_last_desc:0 "While our proud people have fought countless enemies far stronger than us in the past, this time is different, in a way which may doom our nation. The chinese has launched a brutal invasion of our sacred lands, yet they have entered not as our supposed 'liberators', but as conquerors. No soldier, no captive, no sympathising civilian is safe from their wrath, as they burn whatever stands in their way. Whatever they plan to do with our lands, it will be certainly the death of our nation, and perhaps our way of life entirely, if they are to succeed. It's the moral duty of every man who considers themselves an Afgan to pick up a rifle, and fire at every Invader until the last bullet is spent, and the last drop of blood is shed.\n\n§GFor Afganistan!\nAllahu Akhbar!§!"
