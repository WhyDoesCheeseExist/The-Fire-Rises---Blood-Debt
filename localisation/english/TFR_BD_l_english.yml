PRC_keep_chinese_companies_eth_happy:0 "Fund security forces for Sino-Ethiopian Companies"
PRC_keep_chinese_companies_eth_happy_desc:0 "Chinese companies have found a welcoming home in Ethiopia, with the fruits of their efforts in the nation being felt all the way across the sea, back home. However, this war has caused immense unrest among these conglomerates, with many considering leaving the nation entirely due to the threat of NRC forces damaging or even entirely seizing their property. Some "reassurance funding" for their armed security forces should help put these companies worries, and their wallets, at ease."
PRC_secure_ethiopia_permanently:0 "Permit a §RNation-Wide Takeover§!"
PRC_secure_ethiopia_permanently_desc:0 "Unfortunately, the Ethiopian government has not taken too kindly to our supposed "excessive" support of Chinese companies in their nation, with our informants even reporting that a bill is soon to pass in their government, which would put a permanent muzzle on our comrades businesses, and end any chances of us gaining a true ally in Africa. Tragically, with the reactionary and fascist nature of the Ethiopian government now clear to us, we must resort to permitting our endangered companies to take matters into their own hands, with some extra mercenary contracts as a show of support from our end. Many may decry this as the death of Ethiopian independance once more, but in times like these, China, and thus Chinese interests, §Rmust§! come first."
