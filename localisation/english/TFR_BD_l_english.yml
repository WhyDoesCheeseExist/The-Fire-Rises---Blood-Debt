#IDEOLOGY
palingenetic_ultra_nationalism:0 "Palingenetic Han Ultra-Nationalism"
palingenetic_ultra_nationalism_desc:0 "Palingenetic Han Ultra-Nationalism, or more colloquially known as 'Millenarian Han Restorationism', is an ultra-radical ideology which has emerged in the wake of immense political and societal upheaval in both the Chinese government and its people as a whole. Fathered by the enigmatic and heavily controversial figure Zhou Mingfeng, this form of Han Nationalism fuses the growing Esoteric Confucian movements with the most radical beliefs relating to the 'Huixia', or the Han people as a whole, being the superior 'race' on Earth.\nWhile seeming purely ethnic on the surface, Zhou has argued that being 'Han' is far more a spiritual and religious matter rather than one of blood, preaching that the 'Han people' are beings of Divine Origin and thus deserve an eternal golden era, one which has been suppressed and countered by the supposed 'Manchu Elite', the primarily Northern Chinese cabal of secretive figures who wish to destroy the Han people as a whole, by enforcing mutli-ethnic inclusion.\nAn extreme emphasis is placed on the idea of a 'blood debt', owed by all other ethnicities or races, to the Han people, for the supposed centuries of oppression forced upon them, something which must be paid back, presumably in extreme violence.\nThe ideology does not put heavy emphasis on any specific economic system, instead wishing for the total mobilization of the state for the 'Incoming Awakening', an apocalyptic prophecy Zhou believes is soon to occur, where the forces of evil against the Han people will engage in a final struggle for survival against the entire concept of Huixia, yet afterwards will result in the Han people's eternal golden age and domination over the Earth."

