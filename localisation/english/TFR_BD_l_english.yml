#EVENTS
china_BD.1.t: "Rise of Online Nationalism"
china_BD.1.d: "A recent phenominon has swept the country, one of the first major trends seen since the Taiwan War and subsequent PLA coup. While initially seeming like an indicator of slow recovery, it also has some alarming elements attached to it, namely the rise of Chinese culture and ethnic nationalism.\n\nSeveral inlfuencers online have completely changed their content to now cater purely for nationalist content and propoganda, namely focusing on the 'barbaric and evil' members of the PDTO, and the 'foreign parasites' which are shown to be a growing crisis in their videos and posts. With the average Chinese netizen desperate for something to cling onto in these times of immense hardship, a uniting cultural and ethnic bond with millions others seems incredibly appealing, leading to a massive spike of interraction and viewership on these influencers pages. \n\nWhile more moderate and pro-multiculturalist voices have attempted to fight back against this growing narrative, they have been quickly shut down by waves of 'trolls' and critics, which soon overwhelm their comments with insults and accusations of being a 'traitor' or 'PDTO sympthasizer', often resulting in these accounts shutting down due to the pressure. \n\nWhile growing nationalism may seem like a boon for the new, more assertive government, smaller groups which previously had been irrelevant have emerged, framing themselves as the "Ultranationalists" or "Han Nationalists", a much more insidious and dangerous force towards the new regime. Only time will tell however if anything will come of the new movement."
china_BD.1.a: "Simply Patriots voicing their pride online"
china_BD.2.t: "The Rise of Zhou Mingfeng"
china_BD.2.d: "Following the recent Chinese nationalist surge online, an incredibly suprising and, to some analysts, 'baffling' voice has emerged to prominence, this being the voice of Zhou Mingfeng. \n\nInitially a content creator on Billibili centered around job security and technology, his content shifted in 2023, following the Taiwan War, where he voiced his distaste for the 'corrupt and broken' government. When the PLA coup occured soon after, he shifted to a pro-government stance, piggybacking off the surge in online Nationalism to quickly gain himself a noticeable audience, who soon became fanatic supporters of his once he revealed his far more radical views.\n\nZhou has gone into legnths about the "Han Religion" and what it means to be a Han, stating how he does not believe it to be entirely a blood relation, but with ideological and spiritial ties too. Many of his most popular videos describe how the \"Old Han Guard\" had fought with their blood, sweat, and tears to acchieve what the nation is today, and now too moderate nationalist forces like the 'Hanfu Movement' are 'Peach Pickers' and attempting to steal the Old Han's rightful position as rulers of China, gained by the 'blood debt' owed by the people of China and foreign enemies for the crimes they have commited against Han people. His ultimate goal seems to be the establishment of a 'Third Republic', one which the Han will rule utterly, and assert themselves as the true superior race above all others.\n\nPerhaps his most radical view however is the belief that the 'Manchu Elite' and their people are the 'true' rulers of China, hell bent on destroying Han culture and the concept of Huixia itself. He has regularly gone on rants to discuss how the Manchu's constantly exploit the Middle and Southern Kingdoms for their own benefit, while also being the puppet master of Asia, and prehaps even the entire world.\n\nWhile his following has stayed moderately small, his influence is already being seen across the internet, with countless new 'White Lotus' accounts appearing, claiming to be part of the 'resistance to protect all Han people'. It's unlikely that this Zhou character will be dissapearing from discussions anytime soon."
china_BD.2.a: "A strange, yet useful tool"
china_BD.2.b: "He makes a mockery of our nation! Shut him down."
china_BD.100.t: "§CCONFIDENTIAL - Question on Afgan Sovereignty§!"
china_BD.100.d: "##################§R###TOP SECRET§!#######################\n§GMISSION§! | Operation 'Lapis'\n§GBRIEFING§! | Afghanistan has remained a prick in every superpower's sole; the failed Soviet and American interventions are often considered those nations' worst military humiliations. While China avoided the 'nation-building' sinkhole, an independent, radical Afghanistan is taking a toll on our newly expanded border. Since our intervention in Pakistan, the Taliban and militants seized the chaos to raid the border, firing on Pakistani and Chinese soldiers indiscriminately. Worse, reports state minor outposts in the Wakhan Corridor were attacked, resulting in 5 dead and dozens wounded. \n\n§GJUSTIFICATION§! | While the feeble old government would have swept this under the rug out of pacifist fears, we shall not continue the policy of hoping that ignoring such a threat will work. While this is the 'official' explanation, the real reason is simple: the plethora of rare mineral deposits dotting the landscape. With trade routes still recovering from post-Taiwan War sanctions, these materials are needed to inject into the faltering economy and prevent a second recession. \n\n§GPLAN OF ACTION§! | In a rare near-unanimous decision, PLA High Command authorised a top-secret 'lightning incursion' into Afghanistan, aiming to defeat the disorganized military so quickly that resistance is weakened by lack of preparation. With the Pakistani border extending our front, the invasion is a near-certain success, showcasing post-war PLA reforms and employing far deadlier approaches to insurgents than previous attempts. \n\n§GSTATUS§! | §YProceed with invasion at shortest possible opportunity§!"
china_BD.100.a: "§C-Document End-§!"
china_BD.101.t: "§CCONFIDENTIAL - After Action Report on Operation Lapis§!"
china_BD.101.d: "##################§R###TOP SECRET§!#######################\n§GMISSION§! | 'Operation Lapis'\n\n§GBRIEFING§! | Operation Lapis was a complete success after a short, efficient invasion. The Afghan state has ceased to exist; territories outside strict PLA control have fallen into anarchy, preventing resistance from organising or uniting. Our new mission of colony preparation has already begun. \n\n§GCONDUCT OF MISSION§! | This operation showcases the new, unshackled military. Without constrictive disciplinary rules, the PLA achieved unparalleled efficiency, despite increased civilian casualties. To prevent a repeat of past decades, a zero-tolerance approach towards rebel sympathisers has been implemented. Torching excess supplies - guns, fuel, food - was critical in destroying the rural resistance, starving out those hiding in mountainous regions. \n\n§GPATH OF ACTION§! | Harsh counter-partisan measures have caused extreme infrastructure collapse and poverty. Our experts remark that restoring control nationwide is too expensive given the anarchy outside occupied cities. They suggest focusing on controlled areas and letting the rest fend for itself, integrating the land into the Hindu regime.\nHowever, radical officers propose a more extreme solution, driven by deep disdain for the population. They argue 'Purification-style' governance is too lax for such 'uncivilised' people. Instead, they suggest granting state-owned mining companies full control of settlements, allowing near-zero labour laws to maximize extraction. As colonization is already planned, this would squeeze every drop of capital from the region beforehand. \n\n§GCONCLUSION§! | §B2 main options have arisen regarding the occupied territories, which must be decided upon immediately.§!"
china_BD.101.a: "§GOPTION A§! - They fought well, allow some autonomy for now. "
china_BD.101.b: "§GOPTION B§! - §RThrow the scraps to the dogs§!"
china_BD.102.t: "Intervention in the Third African War"
china_BD.102.d: "Online news reports and snippets from international news channels have confirmed that yet another major war has broken out in Africa, this time over the issue of Ethiopia's new dam project.\n\nWhile the Nile River Coalition, as they have named themselves, may have valid reasons to resort to violence in order to resolve this crisis, their squabblings are beyond the new Chinese state, and instead we must view the conflict as what it truly is; a potential seizure of Chinese assets, and thus, influence.\n\nSeveral different Chinese companies have found themselves deeply invested into Ethiopia, investing in huge infrastructure and construction projects, netting them untold billions of Yen. While this already is good reason for us to be concerned for Ethiopia, there is also the vital point of how ingrained these Chinese companies have become, to the point that Chinese culture, especially Chinese language, has begun to seep into the everyday life of the average Ethiopian, with the Chinese New Year one of the biggest celebrations Ethiopia now holds anually.\n\nIt does not take an expert to realise that Ethiopia is by far the best choice for spreading Chinese influence in the region, and eventually the entire continent. However, this comes under immense scrutiny with this wars introduction, with the NRC alligned(and staunchly Anti-Chinese) Tigray rebel faction aspiring to take over large parts of Ethiopia, with the outcome of them nationalising Chinese companies, if they succeed, almost certain to happen. \n\nIn order to protect the livelihoods of our Chinese compatriots operating in Ethiopia - and also to protect our profit margins with that sweet cheap hydroelectric power - the PLA High Command has drafted a resolution to begin offficial "peacekeeping" operations in Ethiopia, which, due to its incredibly vague wording, will grant us near unlimited leeway to support Ethiopia and it's allies, only stopping us from officially entering the war. Regardless, we are confident that with Chinese assistance, Ethiopia, and thus China, shall prosper. "
china_BD.102.a: "For the Glory of China!"
china_BD.99.t: "From a century of Humiliation..."
china_BD.99.d: "An old quote has begun to circulate in international circles as of late - "History doesn't repeat itself, but it sure does rhyme". Many thought that following our humiliation in Taiwan, the Chinese nation would re-enter its period of humiliation, that had defined our history for over a century. \n\nWe shall prove them all wrong, by wiping the smirk off their faces with the butts of our rifles. \n\nAlready, with the replacement of the previous corrupt, decaying, feeble government, China has begun to rebuild itself into a nation worthy of its ancient history, a realm which inspired those from every corner of the earth. Until the Taiwan War, many had begun to believe that the "Chinese Century" was just around the corner, as our influence in nations grew and increasingly more leaders grovelled at our feet. \n\nEven if we have yet to deal with the Westerner threat of the vile PDTO, we shall begin to re-assert ourselves across the world, as we had been doing before the war. This time, however, without the shackles of pacifism and incompetency that shrouded every action of the old government, we will firmly plant down the Chinese flag, with no space for doubt remaining for those questioning our ambition. While it may be unfeasible to directly intervene in the many crisis dotting the globe currently, that does not mean that our guns won't soon be found in the hands of every Sinophillic military, or our companies won't start to stretch across entire nations, or even that many of our steadfast allies won't finally join the worldwide struggle on equal footing as ourselves. \n\nLet the blood of those who doubted us fertilise the ground we shall help liberate, and may the fruits of those ripe lands be packaged and sold with a Chinese label. "
china_BD.99.a: "...to a century of Glory"
china_BD.201.t: "SinoHydro makes a move against our Government!"
china_BD.201.a: "Womp Womp"
china_BD_news.4.t: "Chinese Corporations solidify control over the Horn"
china_BD_news.4.d: "Of all the expected effects that the Ethiopian victory in the Third African War would bring, the relatively swift capitulation of the Ethiopian government to Chinese mega-conglomerates was not one of them. \n\nExperts across the globe had warned of the growing Chinese influence in the region, due to the Aswan Dam, the primary catalyst of the Third African War, being funded and constructed primarily by Chinese companies, yet a move this bold from the group of Corporations present in the nation was still a shock world-wide, as the globe now watches one of the first \"independant\" Corporation-turned-Nation rise from its shackled imposed by the previous government.\n\nSinoHydro, perhaps the largest Chinese company in Ethiopia, has been voted as "head" of this new Corporate regime, with the other companies swearing alliegance in return of little to no labor law restrictions, or business taxes. Protests have erupted across the nation in revolt of the new authoritarian, non-democratic regime, yet few believe anything will result from these movements, as the previous government willingly handed power to the companies.\n\nThe fears of these corporations siding with their homeland have been proven correct, as the first statement released by the new state has confirmed their allignment with China and it's interests, declaring that negotiations to enter their alliance have already begun. Alongside this, they announced that the recently occupied Somalia region will be put under a "joint Sino-Ethiopian occupation force" to help "stabilize the region until civilian governance can return". While businessmen in China celebrate the news of their new ally, the rest of the world looks on somberly, wary of China gaining a firm foothold in the Horn."
china_BD_news.4.a: "A blatant disregard of International Law by Cyber-Punks!"
china_BD_news.4.b: "Perhaps these corporations aren't all bad..."
china_BD_news.4.t: "Fourth African War"
china_BD_news.4.d: "As the world still reels from the aftershocks of the Third African War, yet another conflict has begun in the African continent.\nThe East African Federation, having recently come out of the Third African War as one of its 2 undisputed victors, now has set its gaze upon its ideological enemy, and final stepping stone to full East African "unification", the Congo. Video footage has surfaced online of EAF armored vehicles and planes entering Congo territory and airspace, with conflict in border towns already reported.\nThe far left Congolese regime has only recently ended its extremely bloody and devastating Third Congo War, which ended in them unifying the Central African Republic, the Democratic Republic of the Congo, and the Republic of Congo, into 1 communist state representating all of Central Africa. \nTensions had been building between the 2 super-states since the Congo first ended their war, as the Congo holds land which the EAF considers to be "East African territory", while the Congo had decried the EAF as "a Imperialist Western puppet for the Capitalists", resulting in negotiations between the 2 countries fully breaking down in recent weeks, and the rapid mobilization on the border. \nMost experts on the region have agreed that the chance of a Congo victory seems incredibly slim, as their territory is still partially rubble, their exhausted military composed primarily of militia, and insurgents still present in most outer regions of the nation, leading most to believe that a Congo government collapse, and subsequent surrender, is nearly garaunteed to occur. \nHowever, rumors of diplomacy between the Congo and China have circulated in recent days, due to the similar ideological beliefs of both states. Whether this diplomacy will result in anything fruitful, and if said support will be enough to save the people of the Congo once more, remains to be seen."
china_BD_news.4.a: "Wasn't this war meant to be fought with sticks and stones?"
china_BD_news.4.b: "We must help our Communist brethren!"
china_BD_news.5.t: "Congo victory in the Fourth African War"
china_BD_news.5.d: "Betraying all odds and expectations, the Congo regime has triumphed over the young East African Federation, proclaiming a total victory over their adversary.\nWhile experts initially held immense doubts that the Congo would stand a chance against the far more experienced, better equipped, and larger East African military, the confirmation of Chinese assistance on the side of the Congo seemingly turned the tide of the war.\nSoon after the wars beginning, videos of Chinese "volunteer" soldiers, vehicles, and even planes, in the Congo, surfaced online. While the East African Federation decried this move as "blatant Imperialism from the Chinese", Beijing only responded with a curt statement, proclaiming "we are merely assisting our ideological brothers in their reconstruction program, and their valiant effort against the fascist invasion force from the East". \nIn only a matter of weeks, dozens of Congolese towns, roads, military bases, and infastructure was rebuilt and reinforced, with clear Chinese involvement via "reconstruction" funding, and the encouragement of Chinese corporations to establish themselves in the nation. The EAF military, which soon had to split their forces to deal with a suprising resurgence in East African seperatism, ultimately could not defend against the joint Sino-Congolese offensive, and entered a full rout, ending in their high command signing an unconditional surrender at Dar-Es-Salaam. \nThe Congolese government, suprisingly, has opted for a light peace agreement with the EAF, only seizing the territories of Rwanda and Burundi, deciding to keep the current East African framework, and not disband the federation. Instead, a new Socialist council has been created, picked by the Congolese leadership, and installed as the EAF's new leadership, still under the Congo's governance "until their people can be educated in the teachings of Marx". \nWhile the international community still reels from this shocking victory, revolutionaries around the world celebrate the successful defence of the revoution, and the hopeful "golden age" for the deserving Congolese people."
china_BD_news.5.a: "A new African major power?"
china_BD_news.5.b: "We welcome our Congolese friends to the world stage!"
china_BD_news.6.t: "East African victory in the Fourth African War"
china_BD_news.6.d: "As expected, the East African Federation has come out on top in the Fourth African War, completely annihilating the Congolese military, and sending the regions which they have not occupied into yet another period of violent anarchy.\nThe Congolese military, even with the rumors and supposed sightings of Chinese aid and fighters, could not withstand the far superior East African military, their soldiers quickly routing after the initial few battles, while the already fragile Congolese government attempted to conduct a desperate fighting retreat, their efforts ultimately futile, as insurgents once again rose up in their western regions, deposing the shaky Congolese Junta leadership, the entire nation collaping into anarchy at a frightening pace.\n\nNow, the EAF has set up 2 new military occupation zones, both of which are meant to "pacify" their respective regions, following with a full integration into the East African Federation itself. Celebrations has begun in all major EAF cities, military parades seemingly never-ending, as the Federation council declare the "full unification of East African peoples", making the day of the Congolese surrender a new annual day of celebration in commemoration of this achievement. \n\nLittle is known about the current situation in the rest of the Greater Congo, as all government authorities have seemingly collapsed in a form much worse than seen in the region. With tensions rising in Europe, the Americas still embroiled in conflict, and Asia stuck in a new cold war, most doubt that any organised humanitarian mission will be sent into the region, like seen in previous years. For now, we can only pray that the Congo emerges from this catastrophe, and that the new rule of the EAF will finally bring some peace to the occupied Congolese people."
china_BD_news.6.a: ""I will not say: do not weep; for not all tears are an evil""
china_BD_news.7.t: "Formation of the African Comintern"
china_BD_news.7.d: "Only weeks after the shocking victory of the Congo against the EAF, yet another breaking news event has occured in  the region. The Peoples Republic of Central Africa, formally the Congo, has proclaimed the formation of the "Alliance of Southern Pan-African Socialist Republics", a mega alliance consisting of almost every nation in Southern Africa. The alliance, which had initially been just the Congo and the newly restructured East African Republic, decided to expand its organization to neighbouring socialist or left-leaning nations following the clear benefits of the faction, to a resounding success.\n\nThe alliance, which considers itself to be "the only alliance capable of acchieving true African freedom from Neo-Colonialism and the evils of Fascism", has already taken steps to cement itself as a unifying authority in all member states, as plans for a joint-military force, further economic and political integration, and even their own version of the Schengen Area have been announced to be in the works, alongside a plethora of different "mega-projects" meant to transform Southern Africa into the next biggest tourist zone for people across the globe, plus showcase the "wonders of African ingenuity and culture". \n\nThe international response to this alliance has been incredibly mixed, with European nations either giving cautious congratulations to the alliance heads, or flat out condemnations of the clear socialist foundations of the faction. Leftist forces across the world, particularly in the African continent, has celebrated the news en-masse, believing this to be one of the biggest victories of the "World Revolution" since Chinese reunification, or even the Russian Revolution. \n\nThe only country to give clear support to the alliance so far has been China, which has now confirmed their involvement during the Fourth African War, supporting the Congolese government and military, now followed by plans for a Sino-Congolese treaty.\nRegardless of people's positions on the factions founding, most can agree that for once, Africa seems to be moving forward into the future, a future which may see Africa finally enter a prosperous era."
china_BD_news.7.a: "Africa takes a bold leap forward"
china_BD_news.3.t: "Chinese Invasion of Afganistan"
china_BD_news.3.d: "Footage of Chinese armored vehicles and aircraft flooding into Afghan territory has begun to circulate online, after the weeks of immense tension between the 2 states has seemingly boiled over.\n\nThe new Chinese government has adopted a significantly more hardline approach when it comes to enforcing its interests in foreign policy, with Afganistan the next nation on deaths door, with Mongolia and Pakistan falling under Chinese control just weeks prior. \n\nMilitary buildup on the (now Chinese controlled) Afgan-Pakistani border was reported by Afghan officials in recent days, with the Chinese government staying silent on the matter. It seems that a full tens-of-thousands strong, force has been deployed to this invasion, with chances of Afghan victory seeming extremely slim. \n\nInternational reaction to this update has remained neutral, due to the typically hostile relations between the Afghan government and other major powers, mainly in the west. However, due to widespread reports of 'extreme brutality' and 'disregard for civilian safety' accused against the Chinese invading force, several international organisations like the UN are preparing for a emergency press conference to condemn the war. While the Chinese government has yet to acknowledge the invasion, the new, significantly more assertive regime, is unlikely to back down. "
china_BD_news.3.a: "It's the fall of the League all over again..."
china_BD_news.3.b: "China shall grow larger!"
china_BD_news.1.t: ""White Lotus" Cult enact Coup against Chinese Government"
china_BD_news.1.d: "In an unprecedented turn of events, the Chinese government has seemingly been overthrown again, as leaked video shows truck convoys "5 miles long" converging on the capital.\n\nWhile the previous military leadership was expected to secure permanent power with full PLA backing, dissenting media recently reported the government's usage of "paramilitary cultists." This group, identified as the "White Lotus Society," transitioned from a hidden cult to a force capable of toppling a government as China's internal situation worsened.\n\nTheir elusive leader, Zhou Mingfeng, made a rare appearance alongside Li Zuocheng and other key figures to deliver a nationwide address following the takeover. Although Li reportedly "willingly handed power" to the Society and remains a titular leader, observers noted bruises covered by makeup and his erratic behavior, raising doubts about the voluntary nature of his claims.\n\nNo further news has emerged since the address; a nationwide "blackout" has begun, cutting electricity and signals across major cities. Fleeing civilians have reported "mass killings" and "soldiers roaming the streets" to border authorities, raising dire concerns for civilian safety.\n\nThe PDTO has unilaterally severed ties with the PRC, with other nations expected to follow, as Zhou's past remarks on the "Han's inherent Divine Right" spark international worry. It is certain that China has, once again, irrevocably changed."
china_BD_news.1.a: "And if you look out your left... DEAR GOD THEY'RE EXECUTING CIVILIANS!"
china_BD_news.1.b: "Our era of Humilitation has finally ended"


