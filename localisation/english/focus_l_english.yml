l_english:
 PRC_great_history_continues_copy: "Blackout"
 PRC_great_history_continues_copy_desc: "We have seized the Mandate of Heaven.\n\nChina now lays completely under our control. The Preparations must begin immediately, as our Enemies shall not wait to strike during this moment of confusion.\n\nThey have embedded themselves into our Society for long enough. We shall unleash a wave of terror upon them not seen in a millenia, under the cover of darkness. \nMay all Hans make use of this darkness, as We shall be the ones to return China to light."
